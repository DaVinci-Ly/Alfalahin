<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Camel - Detailed icon -->
  <circle cx="40" cy="40" r="38" fill="#fef8eb" stroke="#d4a020" stroke-width="1.5"/>
  <!-- Body -->
  <ellipse cx="40" cy="52" rx="22" ry="14" fill="#d4a860" stroke="#906020" stroke-width="1.5"/>
  <!-- Single Hump -->
  <path d="M29 38 C 28 30, 32 24, 40 22 C 48 24, 52 30, 51 38 Z" fill="#c89840" stroke="#906020" stroke-width="1.5"/>
  <!-- Neck -->
  <path d="M29 40 C 26 36, 25 30, 27 24 C 29 22, 31 22, 32 25 C 30 30, 30 36, 32 40 Z" fill="#d4a860" stroke="#906020" stroke-width="1.5"/>
  <!-- Head -->
  <ellipse cx="26" cy="20" rx="9" ry="7" fill="#c89840" stroke="#906020" stroke-width="1.5"/>
  <!-- Upper lip (distinctive camel feature) -->
  <path d="M19 24 C 19 26, 21 28, 26 28 C 31 28, 33 26, 33 24" fill="none" stroke="#906020" stroke-width="1.2"/>
  <!-- Nostrils -->
  <ellipse cx="23" cy="25" rx="1.5" ry="1" fill="#806040" stroke="none"/>
  <ellipse cx="28" cy="25" rx="1.5" ry="1" fill="#806040" stroke="none"/>
  <!-- Eye -->
  <ellipse cx="30" cy="17" rx="2.5" ry="2" fill="#141b24"/>
  <circle cx="30.7" cy="16.4" r="0.7" fill="white"/>
  <!-- Eyelash -->
  <path d="M28.5 15.5 L 27 14 M 30 15 L 29 13.5 M 31.5 15.5 L 32 14" stroke="#141b24" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="20" cy="14" rx="3" ry="4" fill="#c89840" stroke="#906020" stroke-width="1" transform="rotate(-10,20,14)"/>
  <ellipse cx="31" cy="12" rx="3" ry="4" fill="#c89840" stroke="#906020" stroke-width="1" transform="rotate(10,31,12)"/>
  <!-- Tail -->
  <path d="M62 52 C 66 48, 68 44, 64 40" fill="none" stroke="#906020" stroke-width="2" stroke-linecap="round"/>
  <path d="M64 40 C 65 38, 64 36, 62 35" fill="none" stroke="#604020" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M25 64 L 23 72 M 23 72 L 20 75 M 23 72 L 26 75" stroke="#906020" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M33 66 L 32 74 M 32 74 L 29 77 M 32 74 L 35 77" stroke="#906020" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M47 66 L 48 74 M 48 74 L 45 77 M 48 74 L 51 77" stroke="#906020" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M55 64 L 57 72 M 57 72 L 54 75 M 57 72 L 60 75" stroke="#906020" stroke-width="2.5" stroke-linecap="round"/>
</svg>
