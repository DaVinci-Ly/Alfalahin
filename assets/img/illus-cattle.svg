<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Cattle / Cow - Detailed icon -->
  <circle cx="40" cy="40" r="38" fill="#fef8eb" stroke="#d4a020" stroke-width="1.5"/>
  <!-- Body -->
  <ellipse cx="40" cy="48" rx="24" ry="17" fill="#f5f0e8" stroke="#a07010" stroke-width="1.5"/>
  <!-- Spots -->
  <ellipse cx="34" cy="45" rx="6" ry="4" fill="#e0d8c8" stroke="none"/>
  <ellipse cx="48" cy="52" rx="5" ry="3.5" fill="#e0d8c8" stroke="none"/>
  <!-- Neck -->
  <path d="M36 31 L 38 22 L 42 22 L 44 31 Z" fill="#f0e8d8" stroke="#a07010" stroke-width="1.2"/>
  <!-- Head -->
  <ellipse cx="40" cy="19" rx="11" ry="9" fill="#f0e8d8" stroke="#a07010" stroke-width="1.5"/>
  <!-- Horns -->
  <path d="M30 14 C 27 10, 24 8, 22 10" fill="none" stroke="#c89010" stroke-width="2" stroke-linecap="round"/>
  <path d="M50 14 C 53 10, 56 8, 58 10" fill="none" stroke="#c89010" stroke-width="2" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="29" cy="17" rx="5" ry="3.5" fill="#f0e8d8" stroke="#a07010" stroke-width="1.2" transform="rotate(-15,29,17)"/>
  <ellipse cx="51" cy="17" rx="5" ry="3.5" fill="#f0e8d8" stroke="#a07010" stroke-width="1.2" transform="rotate(15,51,17)"/>
  <!-- Eyes -->
  <circle cx="35" cy="17" r="2.5" fill="#141b24"/>
  <circle cx="45" cy="17" r="2.5" fill="#141b24"/>
  <circle cx="35.7" cy="16.3" r="0.7" fill="white"/>
  <circle cx="45.7" cy="16.3" r="0.7" fill="white"/>
  <!-- Nostrils -->
  <ellipse cx="37" cy="23" rx="2" ry="1.2" fill="#d4a080" stroke="#a07010" stroke-width="0.8"/>
  <ellipse cx="43" cy="23" rx="2" ry="1.2" fill="#d4a080" stroke="#a07010" stroke-width="0.8"/>
  <!-- Udder -->
  <path d="M32 65 C 32 62, 36 60, 44 60 C 52 60, 56 62, 56 65 C 56 67, 52 68, 44 68 C 36 68, 32 67, 32 65 Z" fill="#f0c0b0" stroke="#c08070" stroke-width="1"/>
  <!-- Legs -->
  <line x1="28" y1="64" x2="26" y2="73" stroke="#a07010" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="65" x2="33" y2="74" stroke="#a07010" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="65" x2="47" y2="74" stroke="#a07010" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="64" x2="54" y2="73" stroke="#a07010" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M64 48 C 68 44, 70 40, 66 36" fill="none" stroke="#a07010" stroke-width="2" stroke-linecap="round"/>
  <path d="M66 36 C 67 33, 66 31, 64 30" fill="none" stroke="#806040" stroke-width="3" stroke-linecap="round"/>
</svg>
