<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-label="رسم توضيحي لمصنع الأعلاف وحقول القمح">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf7ea"/>
      <stop offset="1" stop-color="#f5e6c4"/>
    </linearGradient>
    <linearGradient id="silo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2d8c4"/>
      <stop offset="0.45" stop-color="#f7f2e8"/>
      <stop offset="1" stop-color="#d3c7ae"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c56c"/>
      <stop offset="1" stop-color="#d6a441"/>
    </linearGradient>
    <clipPath id="frame"><rect width="480" height="380" rx="20"/></clipPath>

    <!-- سنبلة قمح -->
    <g id="ear">
      <path d="M0 0 C 1 -20, 2 -40, 4 -62" fill="none" stroke="#b07a1c" stroke-width="2" stroke-linecap="round"/>
      <g fill="#c98f2a">
        <ellipse cx="3" cy="-58" rx="3" ry="6.5"/>
        <ellipse cx="-2" cy="-50" rx="3" ry="6" transform="rotate(-28 -2 -50)"/>
        <ellipse cx="8" cy="-50" rx="3" ry="6" transform="rotate(28 8 -50)"/>
        <ellipse cx="-2" cy="-40" rx="3" ry="6" transform="rotate(-28 -2 -40)"/>
        <ellipse cx="7.5" cy="-40" rx="3" ry="6" transform="rotate(28 7.5 -40)"/>
        <ellipse cx="-2.5" cy="-30" rx="3" ry="6" transform="rotate(-28 -2.5 -30)"/>
        <ellipse cx="6.5" cy="-30" rx="3" ry="6" transform="rotate(28 6.5 -30)"/>
      </g>
      <path d="M4 -64 L 5 -76" stroke="#c98f2a" stroke-width="1" stroke-linecap="round"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="480" height="380" fill="url(#sky)"/>

    <!-- الشمس -->
    <circle cx="96" cy="86" r="42" fill="#f3d58c" opacity="0.55"/>
    <circle cx="96" cy="86" r="28" fill="#efc662" opacity="0.8"/>

    <!-- طيور بعيدة -->
    <path d="M300 62 q6 -6 12 0 q6 -6 12 0" fill="none" stroke="#b9a37a" stroke-width="2" stroke-linecap="round"/>
    <path d="M338 84 q4 -4 8 0 q4 -4 8 0" fill="none" stroke="#b9a37a" stroke-width="1.6" stroke-linecap="round"/>

    <!-- تلال بعيدة -->
    <path d="M0 250 C 70 215, 150 225, 230 240 S 390 210, 480 232 V380 H0Z" fill="#ecd6a4"/>

    <!-- الصوامع -->
    <g>
      <rect x="276" y="118" width="44" height="140" fill="url(#silo)"/>
      <path d="M276 118 Q298 92 320 118Z" fill="#b8841f"/>
      <rect x="326" y="104" width="44" height="154" fill="url(#silo)"/>
      <path d="M326 104 Q348 78 370 104Z" fill="#9a6410"/>
      <rect x="376" y="126" width="44" height="132" fill="url(#silo)"/>
      <path d="M376 126 Q398 100 420 126Z" fill="#b8841f"/>
      <g stroke="#cbbd9f" stroke-width="1.5">
        <line x1="276" y1="150" x2="320" y2="150"/><line x1="276" y1="190" x2="320" y2="190"/><line x1="276" y1="230" x2="320" y2="230"/>
        <line x1="326" y1="140" x2="370" y2="140"/><line x1="326" y1="180" x2="370" y2="180"/><line x1="326" y1="220" x2="370" y2="220"/>
        <line x1="376" y1="160" x2="420" y2="160"/><line x1="376" y1="200" x2="420" y2="200"/><line x1="376" y1="240" x2="420" y2="240"/>
      </g>
    </g>

    <!-- البرج والناقل -->
    <rect x="236" y="84" width="26" height="174" fill="#d9ccb2"/>
    <rect x="232" y="76" width="34" height="14" rx="2" fill="#9a6410"/>
    <path d="M262 92 L 348 80" stroke="#8a7658" stroke-width="4" stroke-linecap="round"/>
    <path d="M262 100 L 298 104" stroke="#8a7658" stroke-width="3" stroke-linecap="round"/>

    <!-- مبنى المصنع -->
    <rect x="120" y="170" width="120" height="88" fill="#fffaf0"/>
    <path d="M112 172 L 180 132 L 248 172Z" fill="#9a6410"/>
    <rect x="120" y="172" width="120" height="6" fill="#e6dac2"/>
    <g fill="#e2cf9f">
      <rect x="134" y="190" width="18" height="16" rx="2"/>
      <rect x="162" y="190" width="18" height="16" rx="2"/>
      <rect x="208" y="190" width="18" height="16" rx="2"/>
    </g>
    <rect x="186" y="214" width="34" height="44" fill="#6f5a3a"/>
    <path d="M186 224 H220 M186 234 H220 M186 244 H220" stroke="#5c4a2f" stroke-width="1.5"/>
    <circle cx="180" cy="152" r="9" fill="#fffaf0"/>
    <path d="M180 145 v12 M176 149 l4 -3 4 3" stroke="#9a6410" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- الأرض -->
    <path d="M0 262 C 90 250, 180 258, 260 256 S 410 250, 480 258 V380 H0Z" fill="url(#field)"/>
    <path d="M0 262 C 90 250, 180 258, 260 256 S 410 250, 480 258" fill="none" stroke="#caa04a" stroke-width="2"/>

    <!-- الشاحنة -->
    <g transform="translate(22 214)">
      <rect x="0" y="6" width="74" height="34" rx="3" fill="#fffaf0" stroke="#d8c9a8" stroke-width="1.5"/>
      <g fill="#e8d3a1" stroke="#c9ad6e" stroke-width="1">
        <rect x="6" y="18" width="18" height="20" rx="4"/>
        <rect x="27" y="18" width="18" height="20" rx="4"/>
        <rect x="48" y="18" width="18" height="20" rx="4"/>
        <rect x="16" y="2" width="18" height="18" rx="4"/>
        <rect x="37" y="2" width="18" height="18" rx="4"/>
      </g>
      <path d="M76 14 H96 L108 28 V40 H76Z" fill="#9a6410"/>
      <path d="M82 18 H94 L102 28 H82Z" fill="#f6e7c4"/>
      <rect x="0" y="38" width="110" height="6" rx="2" fill="#6f5a3a"/>
      <circle cx="20" cy="46" r="8" fill="#2c2a25"/><circle cx="20" cy="46" r="3" fill="#cfc3aa"/>
      <circle cx="90" cy="46" r="8" fill="#2c2a25"/><circle cx="90" cy="46" r="3" fill="#cfc3aa"/>
    </g>

    <!-- صفوف الحقل -->
    <g fill="none" stroke="#c9953a" stroke-width="2" stroke-linecap="round" opacity="0.55">
      <path d="M40 300 Q 240 286 440 300"/>
      <path d="M20 326 Q 240 310 460 326"/>
      <path d="M0 354 Q 240 336 480 354"/>
    </g>

    <!-- سنابل في المقدمة -->
    <g>
      <use href="#ear" transform="translate(30 390) rotate(-8) scale(1.25)"/>
      <use href="#ear" transform="translate(52 392) rotate(4) scale(1.45)"/>
      <use href="#ear" transform="translate(76 392) rotate(14) scale(1.15)"/>
      <use href="#ear" transform="translate(410 392) rotate(-14) scale(1.2)"/>
      <use href="#ear" transform="translate(432 392) rotate(-2) scale(1.5)"/>
      <use href="#ear" transform="translate(456 392) rotate(10) scale(1.25)"/>
    </g>
  </g>
</svg>
