<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Sheep - Detailed icon -->
  <circle cx="40" cy="40" r="38" fill="#fef8eb" stroke="#d4a020" stroke-width="1.5"/>
  <!-- Fluffy body (multiple overlapping circles for wool effect) -->
  <circle cx="40" cy="50" r="18" fill="#f8f6f0" stroke="#c8c0b0" stroke-width="1"/>
  <circle cx="28" cy="46" r="12" fill="#f8f6f0" stroke="#c8c0b0" stroke-width="1"/>
  <circle cx="52" cy="46" r="12" fill="#f8f6f0" stroke="#c8c0b0" stroke-width="1"/>
  <circle cx="33" cy="40" r="10" fill="#f8f6f0" stroke="#c8c0b0" stroke-width="1"/>
  <circle cx="47" cy="40" r="10" fill="#f8f6f0" stroke="#c8c0b0" stroke-width="1"/>
  <circle cx="40" cy="37" r="10" fill="#f8f6f0" stroke="#c8c0b0" stroke-width="1"/>
  <!-- Head -->
  <ellipse cx="40" cy="22" rx="10" ry="9" fill="#e8e0d0" stroke="#a09080" stroke-width="1.5"/>
  <!-- Ears -->
  <ellipse cx="30" cy="22" rx="5" ry="3" fill="#e8e0d0" stroke="#a09080" stroke-width="1.2" transform="rotate(-20,30,22)"/>
  <ellipse cx="50" cy="22" rx="5" ry="3" fill="#e8e0d0" stroke="#a09080" stroke-width="1.2" transform="rotate(20,50,22)"/>
  <!-- Eyes -->
  <ellipse cx="36" cy="20" rx="2" ry="2.5" fill="#141b24"/>
  <ellipse cx="44" cy="20" rx="2" ry="2.5" fill="#141b24"/>
  <circle cx="36.5" cy="19.3" r="0.6" fill="white"/>
  <circle cx="44.5" cy="19.3" r="0.6" fill="white"/>
  <!-- Nose/Snout -->
  <ellipse cx="40" cy="27" rx="4.5" ry="3" fill="#d4c0b0" stroke="#a09080" stroke-width="1"/>
  <circle cx="38.5" cy="27" r="1" fill="#806050"/>
  <circle cx="41.5" cy="27" r="1" fill="#806050"/>
  <!-- Legs -->
  <line x1="30" y1="65" x2="28" y2="74" stroke="#a09080" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="67" x2="35" y2="76" stroke="#a09080" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="67" x2="45" y2="76" stroke="#a09080" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="65" x2="52" y2="74" stroke="#a09080" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hooves -->
  <path d="M25 74 L 28 74 L 31 73" stroke="#605040" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 76 L 35 76 L 38 75" stroke="#605040" stroke-width="2" stroke-linecap="round"/>
  <path d="M42 76 L 45 76 L 48 75" stroke="#605040" stroke-width="2" stroke-linecap="round"/>
  <path d="M49 74 L 52 74 L 55 73" stroke="#605040" stroke-width="2" stroke-linecap="round"/>
</svg>
